name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: javac + RecruitmentSystemTestRunner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Java version
        run: java -version

      - name: Compile production sources
        shell: bash
        run: |
          mkdir -p build/classes
          find src -name "*.java" -print0 \
            | xargs -0 javac -encoding UTF-8 -d build/classes

      - name: Compile tests
        shell: bash
        run: |
          mkdir -p build/test-classes
          find tests -name "*.java" -print0 \
            | xargs -0 javac -encoding UTF-8 \
                -cp build/classes \
                -d build/test-classes

      - name: Run RecruitmentSystemTestRunner
        shell: bash
        run: |
          java -cp build/classes:build/test-classes \
            com.group52.tarecruitment.tests.RecruitmentSystemTestRunner \
            | tee test-output.log
          tail -n 5 test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
